server:
  port: 7086
spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
  datasource:
    url: ${LIGHTING_DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${LIGHTING_DB_USER:lighting}
    password: ${LIGHTING_DB_PASSWORD:lighting}
    driver-class-name: ${LIGHTING_DB_DRIVER:org.postgresql.Driver}
lighting:
  config:
    mode: standalone
    storage:
      type: ${LIGHTING_STORAGE_TYPE:jdbc}
      settings:
        url: ${spring.datasource.url:}
        username: ${spring.datasource.username:}
        password: ${spring.datasource.password:}
    auth:
      enabled: true
      mode: token
      options:
        tokens: ${LIGHTING_CONSOLE_TOKENS:lighting-console-token}
