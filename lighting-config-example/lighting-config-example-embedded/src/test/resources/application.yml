server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:lighting;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: sa
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: always

lighting:
  config:
    embedded:
      storage:
        path: ./target/test-config.json
